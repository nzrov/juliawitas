lead: >-
  works across sound, image, and performance, exploring the affective and
  transformative dimensions of memory, grief, nature, intimacy, and dreams.
  Witas follows an experimental approach to music, combining voice and
  songwriting with multi-instrumental soundscapes, drone, field recordings,
  sculptural breath and extended vocal techniques. Moving between consuming
  distortion and poetic fragility, her work carries an introspective yet
  visceral intensity.
paragraph: >-
  Witas has performed internationally in solo and collaborative formats across
  a diverse range of spaces, including Volksbühne (Berlin, DE), Halle am
  Berghain (Berlin, DE), MS Stubnitz (Hamburg, DE), Astra (Berlin, DE),
  Stadtwerkstatt (Linz, AT), Das Lot (Vienna, AT) and Lost Angeles (Los
  Angeles, US).
