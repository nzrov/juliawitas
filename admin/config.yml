backend:
  name: github
  repo: nzrov/juliawitas
  branch: main
  base_url: https://sveltia-witas-auth.vladislavnazarov.workers.dev

# required by the CMS, but unused (no images are edited here)
media_folder: uploads
public_folder: /uploads

collections:
  - name: site
    label: Website text
    editor:
      preview: false
    files:
      - name: bio
        label: Bio, CV and links
        file: _data/bio.yml
        fields:
          - label: Intro paragraph
            name: lead
            widget: text
            hint: "Julia Witas is the h1-tag, thus editing the paragraph starts after the name."
          - label: Second paragraph
            name: paragraph
            widget: text
          - label: Details (one line per row)
            name: details
            widget: text
          - label: Education
            name: education
            widget: list
            summary: "{{fields.years}} {{fields.degree}}"
            fields:
              - { label: Years, name: years, widget: string }
              - { label: Degree, name: degree, widget: string }
              - { label: Institution, name: institution, widget: string }
          - label: Short note
            name: note
            widget: string
            hint: "Line above the links."
          - label: Links
            name: links
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Text shown, name: label, widget: string }
              - { label: Address, name: url, widget: string, hint: "Include https://... or mailto:" }
              - { label: Open in a new tab, name: new_tab, widget: boolean, default: false, required: false }
